name: Trigger post generation

on:
  schedule:
    # every 20 minutes - adjust once you know your evaluation window
    - cron: "*/20 * * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab to test

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Call generate endpoint
        run: |
          curl -f -X POST "${{ secrets.APP_URL }}/api/agent/generate" \
            -H "Content-Type: application/json" \
            -d "{\"agentId\": \"${{ secrets.AGENT_ID }}\"}"
