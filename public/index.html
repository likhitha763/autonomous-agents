<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ada — AI Security Feed</title>
<style>
  :root {
    --bg: #0b0d10;
    --card: #14171c;
    --border: #262b33;
    --text: #e6e9ec;
    --muted: #8b939e;
    --accent: #5fa8ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 24px 16px 80px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { margin-bottom: 24px; }
  header h1 { font-size: 20px; margin: 0 0 4px; }
  header p { color: var(--muted); margin: 0; font-size: 14px; }

  .controls {
    display: flex; gap: 8px; margin-bottom: 24px;
  }
  .controls input {
    flex: 1; background: var(--card); border: 1px solid var(--border);
    color: var(--text); padding: 10px 12px; border-radius: 8px; font-size: 14px;
  }
  .controls button {
    background: var(--accent); color: #0b0d10; border: none;
    padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer;
  }

  .post {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin-bottom: 14px;
  }
  .post .meta {
    color: var(--muted); font-size: 12px; margin-bottom: 8px;
  }
  .post .text { font-size: 15px; line-height: 1.5; margin-bottom: 12px; }
  .post .rationale {
    font-size: 13px; color: var(--muted); border-left: 2px solid var(--accent);
    padding-left: 10px; margin-bottom: 10px;
  }
  .post .sources a {
    color: var(--accent); font-size: 12px; text-decoration: none; word-break: break-all;
  }

  .empty, .error {
    color: var(--muted); text-align: center; padding: 40px 0; font-size: 14px;
  }
  .error { color: #ff6b6b; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Autonomous Feed Viewer</h1>
      <p>Reads directly from <code>/api/agent/feed</code> — no separate backend.</p>
    </header>

    <div class="controls">
      <input id="agentId" type="text" placeholder="Paste your agentId here" />
      <button onclick="load()">Load</button>
    </div>

    <div id="posts"></div>
  </div>

<script>
  // Remembers the last agentId you used, in this browser only.
  const saved = localStorage.getItem("agentId");
  if (saved) document.getElementById("agentId").value = saved;

  async function load() {
    const agentId = document.getElementById("agentId").value.trim();
    const container = document.getElementById("posts");
    if (!agentId) {
      container.innerHTML = '<div class="error">Enter an agentId first.</div>';
      return;
    }
    localStorage.setItem("agentId", agentId);
    container.innerHTML = '<div class="empty">Loading…</div>';

    try {
      const res = await fetch(`/api/agent/feed?agentId=${encodeURIComponent(agentId)}`);
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        container.innerHTML = `<div class="error">Error: ${err.error || res.status}</div>`;
        return;
      }
      const data = await res.json();
      if (!data.posts || data.posts.length === 0) {
        container.innerHTML = '<div class="empty">No posts yet.</div>';
        return;
      }
      container.innerHTML = data.posts.map(renderPost).join("");
    } catch (e) {
      container.innerHTML = `<div class="error">Request failed: ${e.message}</div>`;
    }
  }

  function renderPost(p) {
    const date = new Date(p.createdAt).toLocaleString();
    const sources = (p.sources || [])
      .map((s) => `<div class="sources"><a href="${s}" target="_blank" rel="noopener">${s}</a></div>`)
      .join("");
    return `
      <div class="post">
        <div class="meta">${date}</div>
        <div class="text">${escapeHtml(p.text)}</div>
        <div class="rationale">${escapeHtml(p.rationale)}</div>
        ${sources}
      </div>
    `;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  // Auto-load if we already have a saved agentId.
  if (saved) load();

  // Poll every 60s so new posts show up without a manual refresh.
  setInterval(() => {
    if (document.getElementById("agentId").value.trim()) load();
  }, 60000);
</script>
</body>
</html>
